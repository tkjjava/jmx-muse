name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check muse_bridge tests

      - name: Check formatting
        run: ruff format --check muse_bridge tests

      # 测试不打真实浏览器：不安装 playwright 浏览器内核，也不连 CDP
      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -v

      - name: Verify package imports
        run: python -c "import muse_bridge; print(muse_bridge.__author__, muse_bridge.__mark__)"

      - name: Verify selector tables
        run: |
          python -c "
          from muse_bridge import selectors
          for name in ('LOGGED_IN_MARKERS', 'COMPOSER_INPUTS', 'SEND_BUTTONS', 'ASSISTANT_MESSAGES', 'STREAMING_MARKERS'):
              table = getattr(selectors, name)
              assert table, name
          print('selectors ok')
          "

      - name: Verify server starts
        env:
          MUSE_BRIDGE_KEY: "Yk1vR3g5dExhM3BXNnFSc1Q5dUMyeVphNGJDNWRFRmdoSTBrTG1Ob1BxUT0="
          MUSE_BRIDGE_DB: "./ci-test.db"
        run: |
          python -m muse_bridge &
          sleep 8
          curl -fsS http://127.0.0.1:8788/healthz
          kill %1
        shell: bash
