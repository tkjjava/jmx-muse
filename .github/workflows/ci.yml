name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check muse_bridge tests

      - name: Check formatting
        run: ruff format --check muse_bridge tests

      # 测试不启动真实浏览器，也不需要 playwright 内核
      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -v

      # 用 ascii 转义输出：Windows runner 的 stdout 是 cp1252，
      # 直接 print 中文会 UnicodeEncodeError
      - name: Verify package imports
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "import muse_bridge; print(muse_bridge.__author__.encode('unicode_escape').decode(), muse_bridge.__mark__.encode('unicode_escape').decode())"

      - name: Verify selector tables
        run: |
          python -c "from muse_bridge import selectors; names=('LOGGED_IN_MARKERS','COMPOSER_INPUTS','SEND_BUTTONS','ASSISTANT_MESSAGES','STREAMING_MARKERS'); [print(f'{n}: {len(getattr(selectors, n))}') for n in names]; assert all(getattr(selectors, n) for n in names); print('selectors ok')"

      # 用 Python 脚本做启动冒烟：跨平台，不需要浏览器
      - name: Smoke test server startup
        env:
          PYTHONIOENCODING: utf-8
          MUSE_BRIDGE_KEY: "C1IQcjvmR1TGXTXrsT1z12eWb4Z6jLqXtqmZ-QBZ5Gs="
          MUSE_BRIDGE_DB: "./ci-smoke.db"
          MUSE_BRIDGE_PORT: "18788"
        run: python -m muse_bridge.smoke
