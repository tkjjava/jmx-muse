<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — 手写图标 sprite（24 × 24，1.8 描边，圆头圆角）。

  为什么有两份：应用运行时把同一组 path 直接内联进 DOM（app 不发起任何额外
  请求，file:// 下也能显示），这份 sprite 供 bridge 或外部页面按需
  <use href="assets/icons.svg#i-xxx"> 复用，二者路径保持一致。
-->
